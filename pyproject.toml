[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Usd"
version = "1.0.0"
description = "Full Pixar USD build with Python, UsdImaging, Hydra, and plugins"
authors = [{ name = "Pixel Muratori" }]
license-files = ["packaged_usd/LICENSE.txt", "packaged_usd/NOTICE.txt"]
requires-python = ">=3.9"
readme = "packaged_usd/README.md"
dependencies = [
    "jinja2",
    "PyOpenGL"
]

[tool.setuptools.packages.find]
where = ["packaged_usd/site-packages"]
include = ["pxr*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"pxr" = ["**/*.**"] # install everything found in packaged_usd/pxr. it is already well formed and prepared


[tool.setuptools.data-files]
"Scripts" = [
    "packaged_usd/Scripts/*"
]